<svg xmlns="http://www.w3.org/2000/svg" width="760" height="406" viewBox="0 0 760 406" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13.5">
<rect width="760" height="406" rx="8" fill="#1b1d21"/>
<text x="22" y="34" fill="#7a8089" font-size="11.5" letter-spacing="0.6">WHAT THE PLANNING SESSION SETTLES</text>
<text x="22.0" y="63" fill="#d7dae0" xml:space="preserve">Here's how I'd sort the decisions so far:</text>
<text x="22.0" y="84" fill="#d7dae0" xml:space="preserve"></text>
<text x="22.0" y="105" fill="#6cb6ff" xml:space="preserve">storefront:</text>
<text x="22.0" y="126" fill="#7a8089" xml:space="preserve">1. </text>
<text x="46.3" y="126" fill="#d7dae0" xml:space="preserve">Checkout only accepts a basket the pricing service priced in the last 15 minutes</text>
<text x="22.0" y="147" fill="#7a8089" xml:space="preserve">2. </text>
<text x="46.3" y="147" fill="#d7dae0" xml:space="preserve">Card details never reach us; the gateway's hosted fields hold them</text>
<text x="22.0" y="168" fill="#7a8089" xml:space="preserve">3. </text>
<text x="46.3" y="168" fill="#d7dae0" xml:space="preserve">An order is </text>
<text x="143.5" y="168" fill="#c8a3ff" xml:space="preserve">cancelled</text>
<text x="216.4" y="168" fill="#d7dae0" xml:space="preserve">, never deleted, so a refund can always find it</text>
<text x="22.0" y="189" fill="#7a8089" xml:space="preserve">4. </text>
<text x="46.3" y="189" fill="#d7dae0" xml:space="preserve">One address book per customer, with no sharing between accounts</text>
<text x="22.0" y="210" fill="#7a8089" xml:space="preserve">5. </text>
<text x="46.3" y="210" fill="#d7dae0" xml:space="preserve">Guest checkout captures an email only, and never creates an account</text>
<text x="22.0" y="231" fill="#d7dae0" xml:space="preserve"></text>
<text x="22.0" y="252" fill="#6cb6ff" xml:space="preserve">pricing-service:</text>
<text x="22.0" y="273" fill="#7a8089" xml:space="preserve">1. </text>
<text x="46.3" y="273" fill="#d7dae0" xml:space="preserve">A quote is immutable and carries its own expiry</text>
<text x="22.0" y="294" fill="#7a8089" xml:space="preserve">2. </text>
<text x="46.3" y="294" fill="#d7dae0" xml:space="preserve">Discount stacking is resolved at quote time, never at checkout</text>
<text x="22.0" y="315" fill="#7a8089" xml:space="preserve">3. </text>
<text x="46.3" y="315" fill="#d7dae0" xml:space="preserve">The service is synchronous, with one quote per basket</text>
<text x="22.0" y="336" fill="#d7dae0" xml:space="preserve"></text>
<text x="22.0" y="357" fill="#6cb6ff" xml:space="preserve">payments:</text>
<text x="22.0" y="378" fill="#7a8089" xml:space="preserve">1. </text>
<text x="46.3" y="378" fill="#d7dae0" xml:space="preserve">Capture happens on dispatch, not on order, so a cancellation needs no refund</text>
</svg>